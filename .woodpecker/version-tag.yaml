when:
  - event: push
    branch: main

steps:
  - name: install dependencies
    image: node:20-bookworm
    commands:
      - npm ci

  - name: typescript check
    image: node:20-bookworm
    commands:
      - npm run check

  - name: run tests
    image: node:20-bookworm
    commands:
      - npm test

  - name: build package
    image: node:20-bookworm
    commands:
      - npm run build

  - name: verify npm package contents
    image: node:20-bookworm
    commands:
      - npm run pack:dry-run

  - name: create and push version tag
    image: node:20-bookworm
    environment:
      CODEBERG_USERNAME:
        from_secret: codeberg_username
      CODEBERG_TOKEN:
        from_secret: codeberg_token
    commands:
      - git config --global --add safe.directory "$${CI_WORKSPACE}"
      - |
        case "$${CI_REPO_CLONE_URL}" in
          https://*)
            ;;
          *)
            echo "Version tag workflow expects an HTTPS clone URL, got: $${CI_REPO_CLONE_URL}" >&2
            exit 1
            ;;
        esac

        clone_url="$${CI_REPO_CLONE_URL#https://}"
        git remote set-url origin "https://$${CODEBERG_USERNAME}:$${CODEBERG_TOKEN}@$${clone_url}"
      - bash scripts/create-version-tag.sh --default-bump patch
