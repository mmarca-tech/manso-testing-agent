when:
  - event: tag
    ref: refs/tags/v*

steps:
  - name: align package version with git tag
    image: node:20-bookworm
    commands:
      - |
        case "$${CI_COMMIT_TAG}" in
          v[0-9]*.[0-9]*.[0-9]*)
            version="$${CI_COMMIT_TAG#v}"
            ;;
          *)
            echo "Publish workflow must run from a semantic version tag like v1.2.3. Actual tag: $${CI_COMMIT_TAG}" >&2
            exit 1
            ;;
        esac

        if ! printf '%s' "$${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "Publish workflow must run from a semantic version tag like v1.2.3. Actual tag: $${CI_COMMIT_TAG}" >&2
          exit 1
        fi

        echo "Setting npm package version to $${version} from tag $${CI_COMMIT_TAG}."
        npm version "$${version}" --no-git-tag-version --allow-same-version

  - name: install dependencies
    image: node:20-bookworm
    commands:
      - npm ci

  - name: typescript check
    image: node:20-bookworm
    commands:
      - npm run check

  - name: run tests
    image: node:20-bookworm
    commands:
      - npm test

  - name: authenticate npm registry
    image: node:20-bookworm
    environment:
      NPM_TOKEN:
        from_secret: npm_token
    commands:
      - |
        if [ -z "$${NPM_TOKEN}" ]; then
          echo "Missing npm_token secret." >&2
          exit 1
        fi

        cat > .npmrc <<EOF
        registry=https://registry.npmjs.org/
        //registry.npmjs.org/:_authToken=$${NPM_TOKEN}
        EOF

  - name: publish manso-testing-agent
    image: node:20-bookworm
    commands:
      - npm publish --userconfig .npmrc --registry https://registry.npmjs.org/
