<svg xmlns="http://www.w3.org/2000/svg" width="1117" height="1590" viewBox="0 0 1117 1590" role="img" aria-labelledby="title desc">
  <title id="title">Testing Agent Gateway flow</title>
  <desc id="desc">Flow diagram matching the provided whiteboard layout, including Jira ticket intake, orchestration stages, LLM gateway, scenarios generation, run store, and run inspection APIs.</desc>

  <defs>
    <pattern id="dotGrid" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1" fill="#e7e7e7"/>
    </pattern>

    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>

    <style>
      text {
        font-family: Arial, Helvetica, sans-serif;
        fill: #1f2937;
      }
      .line {
        fill: none;
        stroke: #9ca3af;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        marker-end: url(#arrow);
      }
      .box-blue {
        fill: #c8d6ee;
        stroke: #2563eb;
        stroke-width: 3;
      }
      .box-green {
        fill: #b4dd72;
        stroke: none;
      }
      .box-yellow {
        fill: #ecd94b;
        stroke: #f97316;
        stroke-width: 3;
      }
      .circle-pink {
        fill: #f4b1ab;
        stroke: none;
      }
      .title {
        font-size: 20px;
        font-weight: 700;
        text-anchor: middle;
      }
      .meta {
        font-size: 10.5px;
        fill: #374151;
        text-anchor: middle;
      }
    </style>
  </defs>

  <rect x="0" y="0" width="1117" height="1590" fill="white"/>
  <rect x="0" y="0" width="1117" height="1590" fill="url(#dotGrid)"/>

  <!-- Jira Ticket -->
  <rect class="box-blue" x="28" y="259" width="248" height="118" rx="22" ry="22"/>
  <text class="title" x="152" y="321">Jira Ticket</text>

  <!-- Jira Automation -->
  <circle class="circle-pink" cx="411" cy="318" r="92"/>
  <text class="title" x="411" y="317">Jira Automation</text>
  <text class="meta" x="411" y="340">Manual trigger from Jira issue</text>

  <!-- Run Inspection APIs -->
  <rect class="box-green" x="548" y="28" width="250" height="118" rx="20" ry="20"/>
  <text class="title" x="673" y="78">Run Inspection APIs</text>
  <text class="meta" x="673" y="99">GET /api/runs/{id} and /artifacts expose status and</text>
  <text class="meta" x="673" y="113">outputs</text>

  <!-- API Intake -->
  <rect class="box-green" x="548" y="259" width="250" height="118" rx="20" ry="20"/>
  <text class="title" x="673" y="321">API Intake</text>
  <text class="meta" x="673" y="343">POST /api/runs, auth, correlation ID, request accepted</text>

  <!-- Request Normalized -->
  <rect class="box-yellow" x="548" y="402" width="250" height="113" rx="20" ry="20"/>
  <text class="title" x="673" y="459">Request Normalized</text>
  <text class="meta" x="673" y="482">defaults, enum validation, explicit doc links, warnings</text>

  <!-- Jira Cloud API -->
  <rect class="box-blue" x="252" y="543" width="251" height="118" rx="22" ry="22"/>
  <text class="title" x="377.5" y="605">Jira Cloud API</text>
  <text class="meta" x="377.5" y="627">issue details and development-panel pull requests</text>

  <!-- Jira Context Collected -->
  <rect class="box-yellow" x="548" y="543" width="250" height="118" rx="20" ry="20"/>
  <text class="title" x="673" y="601">Jira Context Collected</text>
  <text class="meta" x="673" y="623">issue narrative, labels, comments, development</text>
  <text class="meta" x="673" y="637">metadata</text>

  <!-- Run Store + Queue -->
  <rect class="box-green" x="839" y="544" width="252" height="118" rx="20" ry="20"/>
  <text class="title" x="965" y="606">Run Store + Queue</text>

  <!-- Confluence API -->
  <rect class="box-blue" x="252" y="686" width="251" height="118" rx="22" ry="22"/>
  <text class="title" x="377.5" y="747">Confluence API</text>
  <text class="meta" x="377.5" y="769">explicit page retrieval from Jira-linked documentation</text>

  <!-- Confluence Resolved -->
  <rect class="box-yellow" x="548" y="686" width="250" height="118" rx="20" ry="20"/>
  <text class="title" x="673" y="747">Confluence Resolved</text>
  <text class="meta" x="673" y="769">explicit links only, page storage fetch, chunked text</text>

  <!-- Azure DevOps Git API -->
  <rect class="box-blue" x="252" y="827" width="251" height="118" rx="22" ry="22"/>
  <text class="title" x="377.5" y="889">Azure DevOps Git API</text>
  <text class="meta" x="377.5" y="911">repository, PR diff, changed files, neighboring tests</text>

  <!-- Repository + Code context Resolved -->
  <rect class="box-yellow" x="548" y="827" width="250" height="118" rx="20" ry="20"/>
  <text class="title" x="673" y="885">Repository + Code context</text>
  <text class="title" x="673" y="911">Resolved</text>

  <!-- Context Bundle Build -->
  <rect class="box-yellow" x="548" y="1040" width="250" height="113" rx="20" ry="20"/>
  <text class="title" x="673" y="1096">Context Bundle Build</text>
  <text class="meta" x="673" y="1120">Jira + Confluence + repo diff + neighboring tests</text>

  <!-- LLM Gateway -->
  <rect class="box-blue" x="548" y="1192" width="250" height="118" rx="22" ry="22"/>
  <text class="title" x="673" y="1253">LLM Gateway</text>
  <text class="meta" x="673" y="1275">Mock, OpenAI, or Anthropic via replaceable interface</text>

  <!-- Scenarios Generated -->
  <rect class="box-yellow" x="548" y="1358" width="250" height="118" rx="20" ry="20"/>
  <text class="title" x="673" y="1419">Scenarios Generated</text>
  <text class="meta" x="673" y="1441">LLM call, JSON validation, artifact stored on the run</text>

  <!-- connectors -->
  <path class="line" d="M 276 318 H 319"/>
  <path class="line" d="M 503 318 H 548"/>

  <path class="line" d="M 411 226 V 87 H 548"/>
  <path class="line" d="M 798 87 H 964 V 544"/>

  <path class="line" d="M 673 377 V 402"/>
  <path class="line" d="M 798 318 H 964 V 544"/>

  <path class="line" d="M 673 515 V 543"/>
  <path class="line" d="M 503 602 H 548"/>

  <path class="line" d="M 673 661 V 686"/>
  <path class="line" d="M 503 745 H 548"/>

  <path class="line" d="M 673 804 V 827"/>
  <path class="line" d="M 503 886 H 548"/>

  <path class="line" d="M 673 945 V 1040"/>
  <path class="line" d="M 673 1153 V 1192"/>
  <path class="line" d="M 673 1310 V 1358"/>

  <path class="line" d="M 798 1417 H 902 V 662"/>
</svg>