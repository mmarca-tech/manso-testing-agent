<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Manso testing agent workflow</title>
  <desc id="desc">Workflow from Jira ticket context through evidence enrichment, Xray generation, implementation, verification, artifacts, memory, and Confluence documentation.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2f3337" />
    </marker>
    <style>
      .box { fill: #dff2f7; stroke: #b52a22; stroke-width: 2; rx: 8; }
      .source { fill: #fff6c7; }
      .store { fill: #ffefef; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 16px; fill: #2f3337; text-anchor: middle; dominant-baseline: middle; }
      .small { font-size: 14px; }
      .arrow { stroke: #2f3337; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="360" fill="#ffffff" />
  <g>
    <rect class="box source" x="30" y="70" width="130" height="70" />
    <text class="label" x="95" y="105">Jira ticket</text>

    <rect class="box source" x="200" y="70" width="140" height="70" />
    <text class="label" x="270" y="96">Context</text>
    <text class="label small" x="270" y="118">pack</text>

    <rect class="box source" x="380" y="50" width="170" height="110" />
    <text class="label" x="465" y="84">PR, Confluence,</text>
    <text class="label" x="465" y="106">and Xray</text>
    <text class="label small" x="465" y="128">evidence</text>

    <rect class="box" x="590" y="70" width="150" height="70" />
    <text class="label" x="665" y="96">Xray</text>
    <text class="label small" x="665" y="118">generation pack</text>

    <rect class="box" x="780" y="70" width="150" height="70" />
    <text class="label" x="855" y="96">Implementation</text>
    <text class="label small" x="855" y="118">prompt</text>

    <rect class="box" x="970" y="50" width="180" height="110" />
    <text class="label" x="1060" y="84">Codex or Claude</text>
    <text class="label" x="1060" y="106">implementation</text>
    <text class="label small" x="1060" y="128">runner</text>

    <rect class="box" x="780" y="230" width="150" height="70" />
    <text class="label" x="855" y="256">Verification</text>
    <text class="label small" x="855" y="278">and healing</text>

    <rect class="box store" x="590" y="230" width="150" height="70" />
    <text class="label" x="665" y="256">JSON and</text>
    <text class="label small" x="665" y="278">Markdown output</text>

    <rect class="box store" x="380" y="210" width="170" height="50" />
    <text class="label" x="465" y="235">Memory cabin</text>

    <rect class="box store" x="380" y="285" width="170" height="50" />
    <text class="label" x="465" y="310">Confluence docs</text>
  </g>
  <path class="arrow" d="M160 105 H200" />
  <path class="arrow" d="M340 105 H380" />
  <path class="arrow" d="M550 105 H590" />
  <path class="arrow" d="M740 105 H780" />
  <path class="arrow" d="M930 105 H970" />
  <path class="arrow" d="M1060 160 V265 H930" />
  <path class="arrow" d="M780 265 H740" />
  <path class="arrow" d="M590 265 H550 V235" />
  <path class="arrow" d="M590 265 H550 V310" />
</svg>
